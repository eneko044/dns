# =====================================================================
#  servidor.conf — Configuración para configurar-servidor.sh
#  Rellenado con los datos de "Planificación SER".
#  Para otro servidor: copia este fichero, cambia los valores y ejecuta
#     sudo ./configurar-servidor.sh -c otro-servidor.conf
# =====================================================================

# ---------------------------------------------------------------------
#  QUÉ SERVICIOS CONFIGURAR  (si / no)
# ---------------------------------------------------------------------
CONFIGURAR_RED="si"      # IP fija del propio servidor (netplan)
CONFIGURAR_SSH="si"
CONFIGURAR_DHCP="si"
CONFIGURAR_DNS="si"
CONFIGURAR_FIREWALL="no" # ufw: abre solo SSH, DNS y DHCP

# ---------------------------------------------------------------------
#  RED DEL PROPIO SERVIDOR
# ---------------------------------------------------------------------
NOMBRE_HOST="server"
INTERFAZ=""                    # vacío = se detecta sola (la de la ruta por defecto)
IP_SERVIDOR="192.168.1.1"
RED="192.168.1.0/24"           # admite máscaras /8, /16 o /24
GATEWAY="192.168.1.1"
DNS_SERVIDOR="127.0.0.1 8.8.8.8"   # DNS que usa el propio servidor (separados por espacio)

# ---------------------------------------------------------------------
#  SSH
#  Formato:  "usuario:acceso"
#    acceso = denegado              -> no puede entrar por SSH
#             cualquiera            -> desde cualquier IP
#             IP[,IP,...]           -> solo desde esas IP (también vale CIDR: 192.168.1.0/24)
#  Cualquier usuario que NO esté en la lista tampoco podrá entrar por SSH.
# ---------------------------------------------------------------------
SSH_PUERTO="22"
SSH_PERMITIR_ROOT="no"
SSH_CREAR_USUARIOS="si"            # crea los usuarios que no existan en el sistema
SSH_PASSWORD_INICIAL="Cambiame123!" # se obliga a cambiarla en el primer inicio de sesión

SSH_USUARIOS=(
  "marcos:denegado"
  "n3oone:cualquiera"
  "eneko:192.168.1.4"
  "jeremy:192.168.1.4"
  "akram:192.168.1.2,192.168.1.4"
)

# ---------------------------------------------------------------------
#  DHCP (isc-dhcp-server)
# ---------------------------------------------------------------------
DHCP_RANGO_INICIO="192.168.1.3"
DHCP_RANGO_FIN="192.168.1.224"
DHCP_GATEWAY="192.168.1.1"
DHCP_DNS="192.168.1.1"
DHCP_DOMINIO="empresa.local"
DHCP_TIEMPO_CONCESION="86400"      # segundos (1 día)

# IP fijas por MAC (reservas). Formato "nombre:MAC:IP"
# Pon la MAC real del Windows Server (en Windows: ipconfig /all).
DHCP_RESERVAS=(
  # "winserver:00:11:22:33:44:55:192.168.1.2"
)

# ---------------------------------------------------------------------
#  DNS (bind9)
# ---------------------------------------------------------------------
DNS_DOMINIO="empresa.local"
DNS_REENVIADORES="8.8.8.8 1.1.1.1" # para resolver Internet

# Registros de la zona directa. Formato "nombre:IP"
# La zona inversa (PTR) se genera sola a partir de estos registros.
DNS_REGISTROS=(
  "server:192.168.1.1"
  "ssh:192.168.1.1"
  "wordpress:192.168.1.2"
)

# Dominios que resuelve OTRO servidor DNS (p. ej. el Active Directory
# del Windows Server). Formato "dominio:IP_del_DNS"
DNS_ZONAS_REENVIO=(
  # "empresa.com:192.168.1.2"
)

# "no" es lo recomendable si reenvías a un dominio AD inventado (.com que no
# existe en Internet); con "auto" bind rechazaría esas respuestas.
DNS_DNSSEC="no"
